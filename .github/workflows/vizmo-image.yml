name: Build vizmo GARM image
on:
  push:
    branches:
      - vizmo
  workflow_dispatch:

permissions:
  contents: read

env:
  # The Azure provider from the vizmo-vms fork: upstream main plus
  # cloudbase/garm-provider-azure#80 (Spot), #81 (create rollback) and
  # #82 (Standard public IPv4). Pinned by commit.
  GARM_PROVIDERS: "vizmo-vms/garm-provider-azure@f5e3a2f19d7439627aa25d8084ed46ed57ab1f9e"

jobs:
  build:
    name: "Build ${{ matrix.arch }} image"
    # Each architecture builds natively, because building GARM's static
    # binaries under emulation takes far longer.
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/garm"
          docker buildx build \
            --provenance=false \
            --platform "linux/${{ matrix.arch }}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.description=GARM with the vizmo-vms Azure provider" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --build-arg "GARM_REF=${GITHUB_SHA}" \
            --build-arg "GARM_PROVIDERS=${GARM_PROVIDERS}" \
            --output "type=image,name=${image},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file /tmp/metadata.json \
            .
          digest="$(jq -r '."containerimage.digest"' /tmp/metadata.json)"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: "Publish multi-arch image"
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/garm"
          tag="vizmo-${GITHUB_SHA::12}"
          docker buildx imagetools create \
            -t "${image}:${tag}" \
            -t "${image}:vizmo" \
            $(printf "${image}@sha256:%s " *)
          docker buildx imagetools inspect "${image}:${tag}"
          echo "Pushed \`${image}:${tag}\`" >> "$GITHUB_STEP_SUMMARY"
