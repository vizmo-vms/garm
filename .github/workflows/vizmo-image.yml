name: Build vizmo GARM image
on:
  push:
    branches:
      - vizmo
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build"
        required: false
        type: string
        default: "linux/amd64"

permissions:
  contents: read

jobs:
  image:
    name: "Build and push GARM image"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # The Azure provider from the vizmo-vms fork: upstream main plus
      # cloudbase/garm-provider-azure#80 (Spot), #81 (create rollback) and
      # #82 (Standard public IPv4). Pinned by commit.
      GARM_PROVIDERS: "vizmo-vms/garm-provider-azure@f5e3a2f19d7439627aa25d8084ed46ed57ab1f9e"
      PLATFORMS: ${{ inputs.platforms || 'linux/amd64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/garm"
          tag="vizmo-$(git rev-parse --short=12 HEAD)"
          docker buildx build \
            --provenance=false \
            --platform "${PLATFORMS}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.description=GARM with the vizmo-vms Azure provider" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --build-arg "GARM_REF=${GITHUB_SHA}" \
            --build-arg "GARM_PROVIDERS=${GARM_PROVIDERS}" \
            -t "${image}:${tag}" \
            -t "${image}:vizmo" \
            --push .
          echo "Pushed \`${image}:${tag}\`" >> "$GITHUB_STEP_SUMMARY"
